name: Website checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run lint -- --max-warnings=0
      - run: npm run build
      - run: npx tsc --noEmit
      - run: npm audit --omit=dev --audit-level=high
